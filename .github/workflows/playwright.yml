name: Playwright Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      timeout-minutes: 10
      run: npm ci
    - name: Verify Chrome availability
      timeout-minutes: 2
      run: google-chrome --version
    - name: Run UI component tests (Chromium)
      timeout-minutes: 30
      run: npx playwright test --project=chromium tests/uiComponents.spec.js --grep-invert "@argos"
    - name: Run Argos UI snapshot test (Chromium)
      timeout-minutes: 20
      env:
        ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
      run: npx playwright test --project=chromium tests/uiComponents.spec.js --grep "@argos"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
