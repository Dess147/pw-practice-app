name: Playwright Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      timeout-minutes: 10
      run: npm ci
    - name: Verify Chrome availability
      timeout-minutes: 2
      run: google-chrome --version
    - name: Run UI component tests (Chromium)
      timeout-minutes: 30
      run: npx playwright test --project=chromium tests/uiComponents.spec.js --grep-invert "@argos"
    - name: Argos readiness check
      timeout-minutes: 2
      run: |
        if [ -n "$ARGOS_TOKEN" ]; then
          echo "ARGOS_TOKEN is configured"
        else
          echo "ARGOS_TOKEN is missing - Argos upload will be skipped"
        fi
    - name: Run Argos UI snapshot test (Chromium)
      timeout-minutes: 20
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEBUG: "@argos-ci/*"
      run: |
        if [ "$GITHUB_EVENT_NAME" != "push" ]; then
          echo "Skipping Argos upload: event is $GITHUB_EVENT_NAME (push required)."
          exit 0
        fi
        if [ -z "$ARGOS_TOKEN" ]; then
          echo "Skipping Argos upload: ARGOS_TOKEN is missing in repository secrets."
          exit 0
        fi
        npx playwright test --project=chromium tests/uiComponents.spec.js --grep "@argos"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
